name: ci

on:
  push:
  pull_request:

jobs:
  sf01-checksum-gate:
    name: SF0.1 checksum gate (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install the DuckDB tpch extension from the official extension repository
        run: |
          # The extension CDN rejects the default Python user agent (403);
          # curl fetches the same official file. Placing it in the local
          # extension directory lets LOAD tpch work without DuckDB's own
          # HTTP path.
          V=$(python -c "import duckdb; print(duckdb.__version__)")
          DEST="$HOME/.duckdb/extensions/v$V/linux_amd64"
          mkdir -p "$DEST"
          curl -fsSL "https://extensions.duckdb.org/v$V/linux_amd64/tpch.duckdb_extension.gz" | gunzip > "$DEST/tpch.duckdb_extension"
          python - <<'EOF'
          import duckdb
          con = duckdb.connect()
          con.execute("LOAD tpch")
          con.execute("CALL dbgen(sf=0.001)")
          print("tpch extension OK", con.execute("SELECT COUNT(*) FROM lineitem").fetchone())
          EOF

      - name: SQL parity (U-07)
        run: python src/check_sql_parity.py

      - name: Hypothesis decision rules
        run: python src/check_results.py

      - name: Full SF0.1 gate (U-10)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: make ci-check PY=python
